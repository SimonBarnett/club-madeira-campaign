name: episode-yaml-ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Template and live episodes must pass
        run: python tools/validate_episodes.py
      - name: Broken fixture must fail
        run: python tools/validate_episodes.py --expect-fail fixtures/episodes/broken.yaml
      - name: Publish guard refuses unapproved template
        run: |
          if python tools/publish_guard.py episodes/_template.yaml; then
            echo "publish-guard should have refused approved:false"
            exit 1
          fi
